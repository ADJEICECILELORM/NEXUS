name: hb1-daily

# H-B1 paper harness daily chain:
#   1. settle anything resolved (settlement watcher)
#   2. scan the D2 lag window and paper-enter new candidates (harness)
#   3. commit journal + account to the hb1-paper state branch
# Paper only — the harness never places orders.

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC daily
  workflow_dispatch:
  push:
    branches: [main]       # also refresh on every main push (idempotent)

permissions:
  contents: write

concurrency:
  group: hb1-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hb1-paper
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Settlement pass (resolve finished positions)
        run: python -m nexus.paper.settlement --journal data/hb1_paper.jsonl --account data/hb1_account.json

      - name: H-B1 harness pass (scan + paper-enter)
        run: python -m nexus.paper.hb1_harness --max-markets 500 --journal data/hb1_paper.jsonl --account data/hb1_account.json

      - name: Cost report (measured executable costs in the H-B1 zone)
        run: python -m nexus.paper.cost_report --journal data/hb1_paper.jsonl --markdown > data/costs.md

      - name: Commit state
        run: |
          git config user.name "nexus-paper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/hb1_paper.jsonl data/hb1_account.json data/costs.md
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "hb1-paper: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin hb1-paper
