name: hb1-daily

# H-B1 paper harness daily chain:
#   1. sync code from main onto this state branch (data lives here)
#   2. settle anything resolved (settlement watcher)
#   3. scan the D2 lag window and paper-enter new candidates (harness)
#   4. ORACLE scorecard: forecast + score (D6) — silently skipped until
#      the ANTHROPIC_API_KEY repo secret exists
#   5. regenerate the measured-cost report
#   6. commit journal + account + costs + oracle data to the hb1-paper state branch
# Paper only — the harness never places orders. ORACLE has zero authority per D1/D6.

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC daily
  workflow_dispatch:
  push:
    branches: [main, hb1-paper]   # also refresh on pushes (idempotent)

permissions:
  contents: write

concurrency:
  group: hb1-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hb1-paper
          fetch-depth: 0

      - name: Sync code from main (data stays on this branch)
        run: |
          git config user.name "nexus-paper-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          if ! git merge origin/main --no-edit; then
            echo "merge conflict; continuing on previous code"
            git merge --abort || true
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Push synced code (if the merge advanced it)
        run: |
          git diff --quiet origin/hb1-paper HEAD || git push origin hb1-paper

      - name: Settlement pass (resolve finished positions)
        run: python -m nexus.paper.settlement --journal data/hb1_paper.jsonl --account data/hb1_account.json --aegis data/hb1_aegis.json

      - name: H-B1 harness pass (scan + paper-enter)
        run: python -m nexus.paper.hb1_harness --max-markets 500 --journal data/hb1_paper.jsonl --account data/hb1_account.json --aegis data/hb1_aegis.json

      - name: ORACLE forecast pass (D6, skipped without API key)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m nexus.oracle.scorecard forecast --journal data/oracle.jsonl

      - name: ORACLE score settled forecasts (D6)
        run: python -m nexus.oracle.scorecard score --journal data/oracle.jsonl

      - name: ORACLE report
        run: python -m nexus.oracle.scorecard report --journal data/oracle.jsonl > data/oracle_report.md

      - name: Cost report (measured executable costs in the H-B1 zone)
        run: python -m nexus.paper.cost_report --journal data/hb1_paper.jsonl --markdown > data/costs.md

      - name: Commit state
        run: |
          git config user.name "nexus-paper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/hb1_paper.jsonl data/hb1_account.json data/hb1_aegis.json data/costs.md
          git add -f data/oracle.jsonl 2>/dev/null || true
          git add -f data/oracle_report.md 2>/dev/null || true
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "hb1-paper: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin hb1-paper
